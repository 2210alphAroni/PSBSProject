<!-- ================= CONTACT US SECTION ================= -->
<section class="py-5 bg-light">
    <div class="container py-5">

        <!-- Section Heading -->
        <div class="text-center py-5">
            <h2 class="fw-bold">Contact Us</h2>
            <p class="text-muted">We’d love to hear from you. Reach us
                anytime.</p>
        </div>

        <div class="row g-4">

            <!-- Contact Info -->
            <div class="col-lg-4">
                <div class="p-4 bg-dark text-white rounded-4 shadow h-100">
                    <h4 class="fw-bold mb-4">Get in Touch</h4>

                    <div class="d-flex mb-3">
                        <i class="bi bi-geo-alt fs-4 me-3"></i>
                        <p class="mb-0">
                            Mirzapur, Tangail<br>
                            Bangladesh
                        </p>
                    </div>

                    <div class="d-flex mb-3">
                        <i class="bi bi-telephone fs-4 me-3"></i>
                        <p class="mb-0">+880 127687830</p>
                    </div>

                    <div class="d-flex mb-3">
                        <i class="bi bi-envelope fs-4 me-3"></i>
                        <p class="mb-0">nabinuri80@gmail.com</p>
                    </div>

                    <div class="mt-4">
                        <a href="https://github.com/2210alphAroni"
                            target="_blank" class="text-white me-3 fs-5"><i
                                class="fa-brands fa-github"></i></a>
                        <a
                            href="https://www.instagram.com/ronistorys?igsh=eGw2bDNqNnJjMGQ2"
                            target="_blank" class="text-white me-3 fs-5"><i
                                class="fa-brands fa-instagram"></i></a>
                        <a href="https://www.facebook.com/share/1KwkoWNVJN/"
                            target="_blank" class="text-white fs-5 me-3"><i
                                class="fa-brands fa-facebook"></i></a>
                        <a
                            href="https://www.linkedin.com/in/md-nabinur-islam-roni-46b894373?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app"
                            target="_blank" class="text-white me-3 fs-5"><i
                                class="fa-brands fa-linkedin"></i></a>
                    </div>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="col-lg-4">
                <div class="p-4 bg-white rounded-4 shadow h-100">

                    <form (ngSubmit)="submitForm()" #contactForm="ngForm"
                        novalidate>

                        <!-- Name -->
                        <div class="mb-3">
                            <input
                                type="text"
                                class="form-control form-control-lg"
                                name="name"
                                [(ngModel)]="contactData.name"
                                placeholder="Your Name"
                                required
                                #name="ngModel">
                            <small class="text-danger"
                                *ngIf="name.invalid && name.touched">
                                Name is required
                            </small>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <input
                                type="email"
                                class="form-control form-control-lg"
                                name="email"
                                [(ngModel)]="contactData.email"
                                placeholder="Your Email"
                                required
                                email
                                #email="ngModel">
                            <small class="text-danger"
                                *ngIf="email.invalid && email.touched">
                                Valid email is required
                            </small>
                        </div>

                        <!-- Subject -->
                        <div class="mb-3">
                            <input
                                type="text"
                                class="form-control form-control-lg"
                                name="subject"
                                [(ngModel)]="contactData.subject"
                                placeholder="Subject">
                        </div>

                        <!-- Message -->
                        <div class="mb-3">
                            <textarea
                                class="form-control form-control-lg"
                                rows="4"
                                name="message"
                                [(ngModel)]="contactData.message"
                                placeholder="Your Message"
                                required
                                #message="ngModel"></textarea>
                            <small class="text-danger"
                                *ngIf="message.invalid && message.touched">
                                Message is required
                            </small>
                        </div>

                        <!-- Submit Button -->
                        <button
                            type="submit"
                            class="btn btn-dark btn-lg w-100"
                            [disabled]="contactForm.invalid || isSubmitting">
                            {{ isSubmitting ? 'Sending...' : 'Send Message' }}
                        </button>

                        <!-- Success Message -->
                        <div class="alert alert-success mt-3"
                            *ngIf="successMessage">
                            {{ successMessage }}
                        </div>

                        <!-- Error Message -->
                        <div class="alert alert-danger mt-3"
                            *ngIf="errorMessage">
                            {{ errorMessage }}
                        </div>

                    </form>

                </div>
            </div>

            <!-- Google Map -->
            <div class="col-lg-4">
                <div class="rounded-4 overflow-hidden shadow h-100">
                    <iframe
                        src="https://www.google.com/maps?q=Mirzapur,Tangail,Bangladesh&output=embed"
                        width="100%"
                        height="100%"
                        style="border:0;"
                        allowfullscreen
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>

        </div>
    </div>
</section>
<!-- ================= END CONTACT US SECTION ================= -->
