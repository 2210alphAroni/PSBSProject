<div class="container mt-5 py-5">

    <!-- ================= PHOTOGRAPHER INFO ================= -->
    <section class="mb-4 py-5">
        <div class="card shadow-sm mb-4" *ngIf="photographer">
            <div class="card-body d-flex align-items-center gap-3">
                <div
                    class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                    style="width:70px;height:70px;font-size:26px;">
                    {{ photographer.FullName?.charAt(0) }}
                </div>

                <div>
                    <h4 class="mb-1">{{ photographer.FullName }}</h4>
                    <div class="text-muted small">
                        {{ photographer.Email }} • {{ photographer.Phone }}
                    </div>
                    <div class="small text-muted">{{ photographer.Gender
                        }}</div>
                </div>
            </div>
        </div>
    </section>

    <!-- ================= HEADER ================= -->
    <h3 class="mb-4">Photographer Availability</h3>

    <div class="row g-3">

        <!-- Event Date -->
        <div class="col-md-3">
            <label class="form-label">Event Date</label>
            <input
                type="date"
                class="form-control"
                [(ngModel)]="eventDate"
                [min]="minDate"
                required>
        </div>

        <!-- Start Time -->
        <div class="col-md-3">
            <label class="form-label">Start Time</label>
            <input
                type="time"
                class="form-control"
                [(ngModel)]="startTime"
                step="900"
                required>
        </div>

        <!-- Duration -->
        <div class="col-md-3">
            <label class="form-label">Duration (Hours)</label>
            <input
                type="number"
                min="1"
                max="24"
                class="form-control"
                [(ngModel)]="durationHours"
                required>
        </div>

        <!-- Button -->
        <div class="col-md-3 d-flex align-items-end">
            <button
                class="btn btn-primary w-100"
                (click)="checkAvailability()"
                [disabled]="!eventDate || !startTime || !durationHours">
                Check Availability
            </button>
        </div>

    </div>

    <!-- ================= RESULT ================= -->
    <div class="mt-4" *ngIf="isAvailable !== null">
        <span
            class="badge px-4 py-2 fs-6"
            [ngClass]="isAvailable ? 'bg-success' : 'bg-danger'">
            {{ isAvailable ? 'Available' : 'Not Available' }}
        </span>
    </div>

</div>
