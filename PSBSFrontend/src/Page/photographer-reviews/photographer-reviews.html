<div class="reviews-container">

  <h3>My Reviews</h3>

  <div class="average-rating">
    ⭐ Average Rating:
    <strong>{{ averageRating }}</strong> / 5
  </div>

  <div *ngIf="reviews.length === 0" class="no-review">
    No reviews yet
  </div>

  <div *ngFor="let r of reviews" class="review-card">
    <div class="review-header">
      <strong>{{ r.FullName }}</strong>
      <span class="rating">⭐ {{ r.Rating }}/5</span>
    </div>

    <p class="comment">
      "{{ r.ReviewComment }}"
    </p>

    <small class="date">
      {{ r.CreatedAt | date:'medium' }}
    </small>
  </div>

</div>
