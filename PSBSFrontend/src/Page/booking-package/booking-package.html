<section class="py-5 bg-light">
  <div class="container py-5">

    <!-- Header -->
    <div class="text-center mb-5 py-5">
      <h2 class="fw-bold">Photography Booking Form</h2>
      <p class="text-muted">Fill in the details to confirm your booking</p>
    </div>

    <form class="row g-4">

      <!-- Hidden IDs (from login / selection) -->
      <input type="hidden" name="UserId" value="">
      <input type="hidden" name="PhotographerId" value="">
      <input type="hidden" name="PackageId" value="">

      <!-- Event Category -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Category</label>
        <select class="form-select" name="EventCategory" required>
          <option value="">Select Cat</option>
          <option>Wedding</option>
          <option>Reception</option>
          <option>Birthday</option>
          <option>Corporate</option>
          <option>Pre-Wedding</option>
          <option>Baby Shoot</option>
          <option>Product Photography</option>
          <option>Fashion Photography</option>
        </select>
      </div>

      <!-- Event Date -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Event Date</label>
        <input type="date" class="form-control" name="EventDate" required>
      </div>

      <!-- Event Location -->
      <div class="col-12">
        <label class="form-label fw-semibold">Event Location</label>
        <input type="text" class="form-control" name="EventLocation"
               placeholder="Enter event location" required>
      </div>

      <!-- Notes -->
      <div class="col-12">
        <label class="form-label fw-semibold">Additional Notes</label>
        <textarea class="form-control" name="Notes" rows="3"
                  placeholder="Any special instructions (optional)"></textarea>
      </div>

      <!-- Package Snapshot -->
      <div class="col-12">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body">

            <h5 class="fw-bold mb-3">Selected Package Details</h5>

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">Package Name</label>
                <input type="text" class="form-control" name="PackageName" readonly>
              </div>

              <div class="col-md-3">
                <label class="form-label">Duration (Hours)</label>
                <input type="number" class="form-control" name="CoverageDurationHours" readonly>
              </div>

              <div class="col-md-3">
                <label class="form-label">Edited Photos</label>
                <input type="number" class="form-control" name="EditedPhotos" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Raw Files</label>
                <input type="text" class="form-control" name="RawFilesAvailable" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Price (৳)</label>
                <input type="number" class="form-control" name="Price" readonly>
              </div>

            </div>

          </div>
        </div>
      </div>

      <!-- Submit -->
      <div class="col-12 text-center">
        <button type="submit" class="btn btn-dark btn-lg px-5 rounded-pill">
          Confirm Booking
        </button>
      </div>

    </form>

  </div>
</section>
