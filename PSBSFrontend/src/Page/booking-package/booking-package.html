<section class="py-5 bg-light">
  <div class="container py-5">

    <div class="text-center mb-5 py-5">
      <h2 class="fw-bold">Photography Booking Form</h2>
      <p class="text-muted">Fill in the details to confirm your booking</p>
    </div>

    <form
      #bookingForm="ngForm"
      class="row g-4"
      (ngSubmit)="submitBooking()">

      <!-- Event Date -->
      <div class="col-md-12">
        <label class="form-label fw-semibold">Event Date</label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="booking.EventDate"
          name="EventDate"
          required
          #eventDate="ngModel">

        <small class="text-danger"
          *ngIf="eventDate.invalid && bookingForm.submitted">
          Event date is required
        </small>
      </div>

      <!-- Location -->
      <div class="col-12">
        <label class="form-label fw-semibold">Event Location</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="booking.EventLocation"
          name="EventLocation"
          required
          #location="ngModel">

        <small class="text-danger"
          *ngIf="location.invalid && bookingForm.submitted">
          Event location is required
        </small>
      </div>

      <!-- Photographer Selection -->
      <div class="col-12">
        <label class="form-label fw-semibold">Select Photographer</label>

        <select
          class="form-select"
          [(ngModel)]="photographerId"
          name="PhotographerId"
          required>

          <option [ngValue]="0">-- Select Photographer --</option>
          <option *ngFor="let p of photographers" [ngValue]="p.Id">
            {{ p.FullName }}
          </option>
        </select>

        <small class="text-danger"
          *ngIf="photographerId === 0 && bookingForm.submitted">
          Please select a photographer
        </small>
      </div>

      <!-- Notes -->
      <div class="col-12">
        <label class="form-label fw-semibold">Additional Notes</label>
        <textarea
          class="form-control"
          rows="3"
          [(ngModel)]="booking.Notes"
          name="Notes"></textarea>
      </div>

      <!-- Package Info -->
      <div class="col-12">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body">

            <h5 class="fw-bold mb-3">Selected Package Details</h5>

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">Package Name</label>
                <input class="form-control"
                  [(ngModel)]="booking.PackageName"
                  name="PackageName"
                  readonly>
              </div>

              <div class="col-md-3">
                <label class="form-label">Duration (Hours)</label>
                <input class="form-control"
                  [(ngModel)]="booking.CoverageDurationHours"
                  name="CoverageDurationHours"
                  readonly>
              </div>

              <div class="col-md-3">
                <label class="form-label">Edited Photos</label>
                <input class="form-control"
                  [(ngModel)]="booking.EditedPhotos"
                  name="EditedPhotos"
                  readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Raw Files</label>
                <input class="form-control"
                  [value]="booking.RawFilesAvailable ? 'Yes' : 'No'"
                  readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label">Price (৳)</label>
                <input class="form-control"
                  [(ngModel)]="booking.Price"
                  name="Price"
                  readonly>
              </div>

            </div>

          </div>
        </div>
      </div>

      <!-- Submit -->
      <div class="col-12 text-center">
        <button
          class="btn btn-dark btn-lg px-5 rounded-pill"
          type="submit">
          Confirm Booking
        </button>

        <!-- Success Message -->
        <div *ngIf="bookingSuccess" class="mt-3">
          <span class="text-success fw-semibold">
            ✔ Booking Successful
          </span>
        </div>
      </div>

    </form>

  </div>
</section>
