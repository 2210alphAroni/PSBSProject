<div class="container mt-5">
  <h3 class="mb-4">Photographer Availability</h3>

  <div class="row g-3">

    <div class="col-md-3">
      <label class="form-label">Event Date</label>
      <input type="date" class="form-control" [(ngModel)]="eventDate">
    </div>

    <div class="col-md-3">
      <label class="form-label">Start Time</label>
      <input type="time" class="form-control" [(ngModel)]="startTime">
    </div>

    <div class="col-md-3">
      <label class="form-label">Duration (Hours)</label>
      <input type="number" min="1" class="form-control" [(ngModel)]="durationHours">
    </div>

    <div class="col-md-3 d-flex align-items-end">
      <button class="btn btn-primary w-100" (click)="checkAvailability()">
        Check
      </button>
    </div>

  </div>

  <div class="mt-4" *ngIf="isAvailable !== null">
    <span
      class="badge px-4 py-2 fs-6"
      [ngClass]="isAvailable ? 'bg-success' : 'bg-danger'">
      {{ isAvailable ? 'Available' : 'Not Available' }}
    </span>
  </div>
</div>
